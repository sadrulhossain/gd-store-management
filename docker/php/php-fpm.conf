; Production runs the master as the non-root "app" user.
[global]
daemonize = no
error_log = /proc/self/fd/2

[www]
; Only honoured when the master runs as root (development bind mounts); ignored when non-root.
user = app
group = app
listen = 9000
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
pm = dynamic
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
