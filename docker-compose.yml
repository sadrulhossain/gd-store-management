# Development stack. Production: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
name: store-management

x-api-environment: &api-environment
  APP_NAME: ${APP_NAME:-Store Management}
  APP_ENV: ${APP_ENV:-local}
  APP_DEBUG: ${APP_DEBUG:-true}
  APP_URL: ${APP_URL:-http://localhost:8080}
  LOG_CHANNEL: stderr
  LOG_LEVEL: ${LOG_LEVEL:-debug}
  DB_CONNECTION: pgsql
  DB_HOST: store-postgres
  DB_PORT: "5432"
  DB_DATABASE: ${DB_DATABASE:-store}
  DB_USERNAME: ${DB_USERNAME:-store}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
  QUEUE_CONNECTION: database
  CACHE_STORE: database
  SESSION_DRIVER: array
  FILESYSTEM_DISK: private
  STORAGE_PUBLIC_URL: /storage
  UPLOAD_MAX_SIZE: ${UPLOAD_MAX_SIZE:-5M}
  PHP_FPM_MAX_CHILDREN: ${PHP_FPM_MAX_CHILDREN:-10}
  ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-15}
  REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-14}
  LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
  LOGIN_DECAY_SECONDS: ${LOGIN_DECAY_SECONDS:-60}
  SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Store Owner}
  SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-owner}
  SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
  SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
  SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-}
  # Optional pass-through (null = only set when defined in .env). In development the app key,
  # Passport keys and portal client are generated into api/.env by the entrypoint instead.
  APP_KEY:
  PASSPORT_PRIVATE_KEY:
  PASSPORT_PUBLIC_KEY:
  PASSPORT_PORTAL_CLIENT_ID:
  PASSPORT_PORTAL_CLIENT_SECRET:

x-api-build: &api-build
  context: .
  dockerfile: docker/Dockerfile
  target: api-dev
  args:
    APP_UID: ${APP_UID:-1000}
    APP_GID: ${APP_GID:-1000}

x-api-volumes: &api-volumes
  - ./api:/var/www/html
  - store-vendor:/var/www/html/vendor
  - store-uploads:/var/www/html/storage/app

services:
  store-postgres:
    image: postgres:18-alpine3.24
    container_name: store-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-store}
      POSTGRES_USER: ${DB_USERNAME:-store}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    volumes:
      - store-pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [store-network]

  store-api:
    build: *api-build
    image: store-api:${STORE_IMAGE_TAG:-dev}
    container_name: store-api
    user: "${DEV_USER:-0:0}"
    restart: unless-stopped
    environment:
      <<: *api-environment
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
    volumes: *api-volumes
    depends_on:
      store-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "healthcheck-api.sh"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 300s
    networks: [store-network]

  store-worker:
    image: store-api:${STORE_IMAGE_TAG:-dev}
    container_name: store-worker
    build: *api-build
    user: "${DEV_USER:-0:0}"
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--tries=3", "--sleep=3", "--max-time=3600"]
    environment:
      <<: *api-environment
      RUN_MIGRATIONS: "false"
    volumes: *api-volumes
    depends_on:
      store-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'artisan queue:work' >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [store-network]

  store-scheduler:
    image: store-api:${STORE_IMAGE_TAG:-dev}
    container_name: store-scheduler
    build: *api-build
    user: "${DEV_USER:-0:0}"
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    environment:
      <<: *api-environment
      RUN_MIGRATIONS: "false"
    volumes: *api-volumes
    depends_on:
      store-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'artisan schedule:work' >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [store-network]

  store-nginx:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: nginx-gateway
    image: store-nginx:${STORE_IMAGE_TAG:-dev}
    container_name: store-nginx
    restart: unless-stopped
    environment:
      UPLOAD_MAX_SIZE: ${UPLOAD_MAX_SIZE:-5M}
    volumes:
      - store-uploads:/var/www/html/storage/app:ro
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      store-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [store-network]

  store-portal:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: portal-dev
    image: store-portal:${STORE_IMAGE_TAG:-dev}
    container_name: store-portal
    user: "${DEV_USER:-0:0}"
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://store-nginx:8080/api/v1
      GATEWAY_URL: http://store-nginx:8080
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-14}
      WATCHPACK_POLLING: "true"
    volumes:
      - ./portal:/app
      - store-node-modules:/app/node_modules
      - store-next-cache:/app/.next
    ports:
      - "${PORTAL_PORT:-3000}:3000"
    depends_on:
      store-nginx:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 300s
    networks: [store-network]

  store-adminer:
    image: adminer:5.5.1
    container_name: store-adminer
    profiles: [tools]
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: store-postgres
    ports:
      - "127.0.0.1:${ADMINER_HOST_PORT:-8081}:8080"
    depends_on:
      store-postgres:
        condition: service_healthy
    networks: [store-network]

networks:
  store-network:
    name: store-network
    driver: bridge

volumes:
  store-pgdata:
    name: store-pgdata
  store-uploads:
    name: store-uploads
  store-vendor:
    name: store-vendor
  store-node-modules:
    name: store-node-modules
  store-next-cache:
    name: store-next-cache
